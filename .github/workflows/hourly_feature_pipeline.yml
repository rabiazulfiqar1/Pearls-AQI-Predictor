name: Hourly feature pipeline

on:
  schedule:
    # Hourly at minute 5 — gives Open-Meteo time to publish the latest hour
    - cron: "5 * * * *" # minute hour day month weekday
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Prevent overlapping runs if a previous run is still going
concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # generous vs. the <30s target; catches a hung run

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}   # optional, omit the secret if your key is single-project
        run: python -m pipelines.feature_pipeline